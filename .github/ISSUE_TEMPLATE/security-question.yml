name: Dúvida de segurança ou privacidade
description: Relate uma dúvida sem incluir dados de pacientes.
title: "[segurança] "
labels: [security]
body:
  - type: markdown
    attributes:
      value: |
        **Nunca anexe documentos, imagens, nomes ou qualquer dado de paciente.**
        Para vulnerabilidades exploráveis, use o canal privado descrito em SECURITY.md.
  - type: textarea
    id: question
    attributes:
      label: Descrição sem dados sensíveis
    validations:
      required: true

